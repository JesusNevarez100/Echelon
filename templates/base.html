<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{% block title %}Echelon{% endblock %}</title>

    <!-- BOOTSTRAP boot up-->
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Quick + decent default styling (no build tools) -->
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; margin: 0; background: #0b1220; color: #e6e8ee; }
      a { color: inherit; text-decoration: none; }
      .container { max-width: 1000px; margin: 0 auto; padding: 24px; }
      .nav { display:flex; justify-content: space-between; align-items: center; padding: 16px 24px; border-bottom: 1px solid rgba(255,255,255,.08); background: rgba(0,0,0,.2); }
      .brand { font-weight: 800; letter-spacing: .4px; }
      .pill { display:inline-block; padding: 6px 10px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; font-size: 12px; opacity: .9; }
      .btn { display:inline-block; padding: 10px 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); }
      .btn.primary { background: #4f7cff; border-color: rgba(79,124,255,.6); }
      .btn:hover { filter: brightness(1.07); }
      .grid { display:grid; 
          grid-template-columns: repeat(12, 1fr);
          gap: 16px; 
      }
      {% comment %} .card { border: 1px solid rgba(255,255,255,.10); border-radius: 16px; padding: 16px; background: rgba(255,255,255,.04); } {% endcomment %}
      .card {
          background: #2c2c3a;
          {% comment %} border-radius: 12px; {% endcomment %}
          border: 1px solid rgba(255,255,255,.10); 
          border-radius: 16px; 
          padding: 16px;
      }
      .muted { opacity:.8; }
      .footer { opacity:.7; padding: 24px; text-align:center; border-top: 1px solid rgba(255,255,255,.08); }
      input { width: 98%; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,.14); background: rgba(0,0,0,.25); color: #e6e8ee; }
      label { display:block; margin-bottom: 6px; opacity: .9; }
      .error { color: #ff8a8a; }
      .row { display:flex; gap: 10px; flex-wrap: wrap; }

      .services-table {
          width: 100%;
          border-collapse: collapse;
          color: #e6e8ee;
          font-size: 14px;
      }

      .services-table th,
      .services-table td {
          padding: 12px 16px;
          text-align: left;
          border-bottom: 1px solid rgba(255,255,255,.12);
          vertical-align: top;
      }

      .services-table th {
          background: rgba(255,255,255,.05);
          font-weight: 600;
      }

    </style>
  </head>

  <body>
    <div class="nav">
      <div>
        <a class="brand" href="/">ECHELON</a>
        <span class="pill" style="margin-left:10px;">E2E Encrypted CRM</span>
      </div>

      <div class="row">
        {% if user.is_authenticated %}
          <a class="btn" href="/dashboard/"><i class="bi bi-house"></i></a>
          <a class="btn" href="/accounts/logout/">Logout</a>
        {% else %}
          <a class="btn" href="/accounts/login/">Login</a>
        {% endif %}
      </div>
    </div>

    <main class="container">
      {% block content %}{% endblock %}
    </main>

    <div class="footer">
      <div class="muted">Echelon — secure CRM foundation (MVP)</div>
    </div>
  </body>
</html>
