{% extends "base.html" %}

  <div class="grid">
    <a class="card" style="grid-column: span 6;" href="/crm/">
      <h2 style="margin:0 0 6px 0;">CRM</h2>

    <a class="card" style="grid-column: span 6;" href="/services/all">

    <a class="card" style="grid-column: span 6;" href="/billing/">
